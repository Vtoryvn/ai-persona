<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persona Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <h1>Persona Console</h1>
          <p>Quản lý instructions & rubric</p>
        </div>
        <div id="llm-badge" class="llm-badge">Đang tải LLM config...</div>
        <button id="new-persona" class="btn primary">+ Persona mới</button>
        <ul id="persona-list" class="persona-list"></ul>
      </aside>

      <main class="editor">
        <div id="empty-state" class="empty-state">
          Chọn persona bên trái hoặc tạo mới.
        </div>

        <form id="persona-form" class="hidden">
          <header class="editor-header">
            <div>
              <h2 id="form-title">Persona</h2>
              <p id="form-subtitle"></p>
            </div>
            <div class="actions">
              <button type="button" id="delete-persona" class="btn danger">Xóa</button>
              <button type="submit" class="btn primary">Lưu</button>
            </div>
          </header>

          <div class="grid">
            <label>
              ID
              <input id="field-id" name="id" pattern="[a-z0-9-]+" required />
            </label>
            <label>
              Tên hiển thị
              <input id="field-name" name="name" required />
            </label>
          </div>

          <label>
            Mô tả ngắn
            <input id="field-description" name="description" required />
          </label>

          <label>
            Instructions / System prompt
            <textarea id="field-instructions" name="instructions" rows="14" required></textarea>
          </label>

          <label>
            Rubric (mỗi dòng một tiêu chí)
            <textarea id="field-rubric" name="rubric" rows="5" required></textarea>
          </label>

          <div class="grid">
            <label>
              Viewport
              <input id="field-viewport" name="viewport" placeholder="1280x720" />
            </label>
            <label>
              Locale
              <input id="field-locale" name="locale" placeholder="vi-VN" />
            </label>
            <label>
              Fly app
              <input id="field-fly-app" name="flyApp" required />
            </label>
            <label>
              Fly region
              <input id="field-fly-region" name="flyRegion" required />
            </label>
          </div>

          <p id="status" class="status"></p>
        </form>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
